<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aman</title>
  <meta name="description" content="Hi, I'm Aman. A simple page." />
  <style>
    :root {
      --bg: #0a0a0b;
      --fg: #f5f5f7;
      --muted: #8b8b93;
      --accent: #6d7cff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: grid;
      place-items: center;
      padding: 2rem;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -40%;
      background:
        radial-gradient(closest-side at 30% 30%, rgba(109, 124, 255, 0.16), transparent),
        radial-gradient(closest-side at 75% 70%, rgba(255, 109, 180, 0.10), transparent);
      pointer-events: none;
    }

    main {
      position: relative;
      text-align: center;
      max-width: 640px;
    }

    h1 {
      font-size: clamp(3rem, 12vw, 6.5rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      background: linear-gradient(180deg, #ffffff 0%, #9fa2b8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p {
      margin-top: 1.5rem;
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      color: var(--muted);
      line-height: 1.6;
    }

    .dot {
      display: inline-block;
      width: 0.22em;
      height: 0.22em;
      border-radius: 50%;
      background: var(--accent);
      margin-left: 0.35em;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hi, Aman<span class="dot"></span></h1>
    <p>Welcome to my little corner of the internet. More coming soon.</p>
  </main>
</body>
</html>
